<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Room</title>

<style>

body {
    font-family: Arial;
    background: #eee;
}

/* NAV */
.nav {
    background: #9cc48b;
    padding: 15px;
    text-align: center;
}

.nav button {
    background: #ddd;
    border: none;
    padding: 10px 20px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
}

.nav button:hover {
    background: #ccc;
}

/* TITLE */
.title-box {
    border: 1px solid green;
    display: inline-block;
    padding: 10px 40px;
    margin: 20px;
    font-weight: bold;
}

/* ACTION BUTTON */
.action-btn {
    display: inline-block;
    margin: 20px;
    padding: 15px 40px;
    background: #9cc48b;
    border-radius: 50px;
    border: none;
    cursor: pointer;
}

.action-btn:hover {
    background: #00a600;
}

/* TABLE */
table {
    width: 100%;
    margin-top: 30px;
    border-collapse: collapse;
}

th {
    background: #6ea84f;
    color: white;
    padding: 10px;
    border: 1px solid black;
}

td {
    background: #d9e3d0;
    padding: 10px;
    text-align: center;
    border: 1px solid black;
}

/* INPUT */
input {
    padding: 8px;
}

/* MESSAGE */
#message {
    margin-top: 15px;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

    <!-- NAV -->
    <div class="nav">

        <button onclick="goTo('dashboard.html')">
            Bảng điều khiển
        </button>

        <button onclick="goTo('room.html')">
            Phòng
        </button>

        <button onclick="goTo('tenant.html')">
            Người thuê
        </button>

        <button onclick="goTo('contract.html')">
            Hợp đồng
        </button>

        <button onclick="goTo('invoice.html')">
            Hóa đơn
        </button>

    </div>

    <!-- TITLE -->
    <div class="title-box">
        QUẢN LÝ PHÒNG
    </div>

    <br>

    <!-- SEARCH -->
    <input
        type="text"
        id="searchRoom"
        placeholder="Nhập số phòng..."
    >

    <button
        class="action-btn"
        onclick="searchRoom()"
    >
        Tìm phòng
    </button>

    <!-- ADD ROOM -->
    <h3>Thêm phòng</h3>

    <input type="text" id="roomNumber" placeholder="Số phòng">

    <input type="number" id="capacity" placeholder="Sức chứa">

    <input type="number" id="price" placeholder="Giá phòng">

    <select id="status">
        <option value="AVAILABLE">AVAILABLE</option>
        <option value="FULL">FULL</option>
    </select>

    <button
        class="action-btn"
        onclick="addRoom()"
    >
        Thêm phòng
    </button>

    <!-- MESSAGE -->
    <p id="message"></p>

    <!-- TABLE -->
    <table id="roomTable">

        <thead>

            <tr>
                <th>ID</th>
                <th>Phòng</th>
                <th>Sức chứa</th>
                <th>Giá phòng</th>
                <th>Trạng thái</th>
                <th>Xóa</th>
            </tr>

        </thead>

        <tbody id="roomBody">

        </tbody>

    </table>

</div>

<script>

const API_URL =
    "http://localhost:8080/api/rooms";


// LOAD ALL ROOMS
async function loadRooms() {

    try {

        const response =
            await fetch(API_URL);

        const rooms =
            await response.json();

        console.log(rooms);

        const roomBody =
            document.getElementById("roomBody");

        roomBody.innerHTML = "";

        rooms.forEach(room => {

            let row = `

                <tr>

                    <td>${room.id}</td>

                    <td>${room.roomNumber}</td>

                    <td>${room.capacity}</td>

                    <td>
                        ${room.price.toLocaleString("vi-VN")} VNĐ
                    </td>

                    <td>${room.status}</td>

                    <td>

                        <button onclick="deleteRoom(${room.id})">

                            Xóa

                        </button>

                    </td>

                </tr>

            `;

            roomBody.innerHTML += row;

        });

    }

    catch (error) {

        console.log(error);

        document.getElementById("message").innerHTML =
            "Không thể tải dữ liệu phòng";

    }

}


// ADD ROOM
async function addRoom() {

    const roomNumber =
        document.getElementById("roomNumber").value;

    const capacity =
        document.getElementById("capacity").value;

    const price =
        document.getElementById("price").value;

    const status =
        document.getElementById("status").value;

    try {

        const response = await fetch(
            API_URL,
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    roomNumber: roomNumber,
                    capacity: Number(capacity),
                    price: Number(price),
                    status: status

                })

            }
        );

        const result =
            await response.json();

        console.log(result);

        document.getElementById("message").style.color =
            "green";

        document.getElementById("message").innerHTML =
            "Thêm phòng thành công";

        loadRooms();

    }

    catch (error) {

        console.log(error);

        document.getElementById("message").style.color =
            "red";

        document.getElementById("message").innerHTML =
            "Không thể thêm phòng";

    }

}


// DELETE ROOM
async function deleteRoom(id) {

    try {

        const response = await fetch(

            API_URL + "/" + id,

            {
                method: "DELETE"
            }

        );

        const result =
            await response.json();

        console.log(result);

        loadRooms();

    }

    catch (error) {

        console.log(error);

    }

}


// SEARCH ROOM
function searchRoom() {

    let input =
        document.getElementById("searchRoom")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll("#roomBody tr");

    rows.forEach(row => {

        let room =
            row.cells[1]
            .innerText
            .toLowerCase();

        if (room.includes(input)) {

            row.style.display = "";

        }

        else {

            row.style.display = "none";

        }

    });

}


// TURN PAGE
function goTo(page) {

    window.location.href = page;

}


// AUTO LOAD
loadRooms();

</script>

</body>

</html>
