<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    font-family: Arial;
    background: #eee;
    text-align: center;
}

/* BOX */
.container {
    border: 1px solid black;
    width: 800px;
    margin: auto;
    padding: 20px;
    margin-top: 50 px;
    background: white;
}

/* HEADER */
.header {
    background: #9cc48b;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    font-size: 24px;
    font-weight: bold;
}

/* ROLE */
.role {
    margin: 15px 0;
}

/* INPUT */
.input-box {
    width: 60%;
    margin: 10px auto;
}

.input-box label {
    display: block;
    background: #4f73b7;
    color: white;
    padding: 8px;
    text-align: left;
}

.input-box input {
    width: 100%;
    padding: 10px;
    border: none;
    background: #c0c6d6;
    box-sizing: border-box;
}

/* BUTTON */
.login-btn {
    margin-top: 20px;
    padding: 10px 30px;
    background: #7da3c7;
    border: none;
    cursor: pointer;
    color: white;
    font-size: 16px;
}

.login-btn:hover {
    background: #5b8bb5;
}

.forgot-btn {
    margin-top: 10px;
    padding: 8px 20px;
    background: #eee;
    border: 1px solid green;
    cursor: pointer;
}

.register-text {
    margin-top: 15px;
}

.register-text a {
    color: red;
    text-decoration: underline;
    cursor: pointer;
}

.register-text a:hover {
    color: darkred;
}

/* MESSAGE */
#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        HỆ THỐNG QUẢN LÝ NHÀ TRỌ/KÝ TÚC XÁ
    </div>

    <!-- ROLE -->
    <div class="role">
        <p>Bạn là người dùng / quản trị?</p>

        <input type="radio" name="role" value="user"> Người dùng (User)
        <br>
        <input type="radio" name="role" value="admin"> Người quản trị (Admin)
    </div>

    <!-- USERNAME -->
    <div class="input-box">
        <label>Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập username">
    </div>

    <!-- PASSWORD -->
    <div class="input-box">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập password">
    </div>

    <!-- LOGIN -->
    <button class="login-btn" onclick="login()">
        Đăng nhập
    </button>
    
    <br>
    
    <button class="forgot-btn">
        Quên mật khẩu?
    </button>

    <!--  -->
    <p class="register-text">
    Bạn chưa có tài khoản? 
    <a href="register.html">Đăng ký ngay</a>
    </p>

    <!-- MESSAGE -->
    <p id="message"></p>

</div>

<script>
async function login() {
    let role = document.querySelector('input[name="role"]:checked');
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let message = document.getElementById("message");

    // CHECK ROLE
    if (!role) {
        alert("Vui lòng chọn User hoặc Admin");
        return;
    }
    try{
    // CALL API LOGIN
        const response = await fetch(
            "http://localhost:8080/api/auth/login",
            {
                method: "POST",
                
                headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username: username,
                password: password,
               
            })

            }
        );


    if (role.value === "admin") {
        // 👉 ADMIN → vào dashboard
        window.location.href = "dashboard.html";
    } else {
        // 👉 USER → vào trang user (chưa làm)
        window.location.href = "user.html";
    }
}
        // Convert JSON
        const result = await response.json();

        console.log(result);

        // LOGIN SUCCESS
        if (result.success === true) {

            message.style.color = "green";

            message.innerHTML = result.message;

            // SAVE USER
            localStorage.setItem(
                "user",
                JSON.stringify(result.data)
            );

            // Redirect
            setTimeout(() => {

                if (result.data.role === "ADMIN") {

                    window.location.href = "dashboard.html";

                } else {

                    window.location.href = "user.html";

                }

            }, 1000);

        }

        // LOGIN FAIL
        else {

            message.style.color = "red";

            message.innerHTML = result.message;

        }

    }

    catch (error) {

        console.log(error);

        message.style.color = "red";

        message.innerHTML =
            "Không thể kết nối tới backend";

    }

}

</script>

</body>
</html>
